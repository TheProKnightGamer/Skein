org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.1.106
forge_version_range=[47,)
loader_version_range=[47,)

# NeoForge 1.20.1 (47.1.x) does not bundle MixinExtras either, so Skein nests it (jarJar).
# 0.5 or later: Skein's SpeeDeeEntity collider hook declares its TickCache
# parameter as @Coerce Object, which @WrapMethod accepts only from 0.5. With
# 0.4.1 the hook failed to apply whenever SpeeDeeEntity was installed.
mixinextras_version=0.5.4

# Mod
mod_id=skein
mod_name=Skein
mod_license=All Rights Reserved
mod_version=1.0.1
mod_group_id=com.theproknightgamer.skein
mod_authors=TheProKnightGamer
mod_description=Ticks each dimension on its own thread, and optionally ticks entities in parallel across spatial regions. Server-side, config-driven, with a per-tick barrier so vanilla ordering guarantees survive.
