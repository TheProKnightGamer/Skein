modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "skein_logo.png"
logoBlur = true
# Server-side only: no packets, no client code. Clients join a Skein server
# without it, and a singleplayer world gets it through the integrated server.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Lithium reads this table from every mod before it selects its mixins, and so
# does the copy SuperChunk bundles. These nine features cache per-level state
# that more than one thread in a level corrupts (see LithiumCompat), and with
# any of them on Skein has to keep the in-level phases off. Asking for them off
# here means installing both mods just works. Everything else Lithium does stays
# on. A line in lithium.properties still wins over this, and Skein checks what
# Lithium actually applied, so turning one back on only turns those phases off.
["lithium:options"]
"mixin.alloc.chunk_random" = false
"mixin.util.world_border_listener" = false
"mixin.world.block_entity_ticking.world_border" = false
"mixin.world.chunk_access" = false
"mixin.block.hopper" = false
"mixin.chunk.entity_class_groups" = false
"mixin.entity.inactive_navigations" = false
"mixin.entity.collisions.unpushable_cramming" = false
"mixin.util.block_entity_retrieval" = false
