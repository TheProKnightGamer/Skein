org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment gives the vanilla parameters real names, which matters a lot here:
# almost every class this mod touches is a vanilla tick loop.
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# Environment
minecraft_version=1.21.11
minecraft_version_range=[1.21.11,1.22)
neo_version=21.11.42
neo_version_range=[21.11,)
loader_version_range=[4,)

# Mod
mod_id=skein
mod_name=Skein
mod_license=MIT
mod_version=1.0.1
mod_group_id=com.theproknightgamer.skein
mod_authors=TheProKnightGamer
mod_description=Multithreaded server ticking. Dimensions tick in parallel, and random ticks, entities and block entities are split across spatial regions that tick at the same time. Server-side only, with a per-tick barrier so vanilla's ordering guarantees survive.
